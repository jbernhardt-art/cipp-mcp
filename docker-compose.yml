services:
  caddy:
    image: caddy:2.10-alpine
    container_name: cipp-mcp-caddy
    restart: unless-stopped
    depends_on:
      cipp-mcp:
        condition: service_healthy
    ports:
      - "${MCP_HTTPS_BIND_IP}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

  cipp-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cipp-mcp:latest
    container_name: cipp-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CIPP_BASE_URL=${CIPP_BASE_URL}
      - CIPP_API_KEY=${CIPP_API_KEY}
      - CIPP_TENANT_ID=${CIPP_TENANT_ID}
      - CIPP_CLIENT_ID=${CIPP_CLIENT_ID}
      - CIPP_CLIENT_SECRET=${CIPP_CLIENT_SECRET}
      - CIPP_TOKEN_SCOPE=${CIPP_TOKEN_SCOPE}
      - CIPP_TOKEN_URL=${CIPP_TOKEN_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - MCP_AUDIT_LOG_FILE=${MCP_AUDIT_LOG_FILE:-/app/logs/audit.log}
      - MCP_AUDIT_LOG_MAX_SIZE_MB=${MCP_AUDIT_LOG_MAX_SIZE_MB:-10}
      - MCP_AUDIT_LOG_MAX_FILES=${MCP_AUDIT_LOG_MAX_FILES:-10}
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=${AUTH_MODE:-env}
      - MCP_HTTP_CLIENT_AUTH=${MCP_HTTP_CLIENT_AUTH:-bearer}
      - MCP_HTTP_BEARER_TOKEN_HASHES=${MCP_HTTP_BEARER_TOKEN_HASHES}
      - MCP_HTTP_TRUST_PROXY=${MCP_HTTP_TRUST_PROXY:-true}
      - CIPP_ENABLED_TOOLS=${CIPP_ENABLED_TOOLS}
      - CIPP_READ_CACHE_TTL_SECONDS=${CIPP_READ_CACHE_TTL_SECONDS:-300}
      - NODE_ENV=production
    volumes:
      - cipp-mcp-logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  cipp-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: cipp-mcp:dev
    container_name: cipp-mcp-dev
    working_dir: /app
    restart: "no"
    command: npm run dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FORMAT=${LOG_FORMAT:-simple}
      - CIPP_BASE_URL=${CIPP_BASE_URL}
      - CIPP_API_KEY=${CIPP_API_KEY}
      - CIPP_TENANT_ID=${CIPP_TENANT_ID}
      - CIPP_CLIENT_ID=${CIPP_CLIENT_ID}
      - CIPP_CLIENT_SECRET=${CIPP_CLIENT_SECRET}
      - CIPP_TOKEN_SCOPE=${CIPP_TOKEN_SCOPE}
      - CIPP_TOKEN_URL=${CIPP_TOKEN_URL}
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=${AUTH_MODE:-env}
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - cipp-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  cipp-mcp-logs:
    driver: local
  cipp-mcp-dev-logs:
    driver: local

# Example .env file structure (create this file with your actual credentials):
# CIPP_BASE_URL=https://cippXXXXX.azurewebsites.net   # Function App URL, not the SWA UI URL
# CIPP_API_KEY=your-api-key-here
# LOG_LEVEL=info
# LOG_FORMAT=json
